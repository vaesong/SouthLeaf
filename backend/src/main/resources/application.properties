spring.application.name=southleaf-public-api
server.address=${SOUTHLEAF_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8090}
spring.datasource.url=${SOUTHLEAF_DB_URL}
spring.datasource.username=${SOUTHLEAF_DB_USERNAME}
spring.datasource.password=${SOUTHLEAF_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.read-only=true
# Migrations are an explicit deployment step, never executed by the reader account.
spring.flyway.enabled=false
spring.sql.init.mode=never
spring.web.resources.add-mappings=false
southleaf.public.mode=demo
southleaf.media.root=${SOUTHLEAF_MEDIA_ROOT}
logging.file.name=logs/application.log
logging.logback.rollingpolicy.file-name-pattern=logs/application.%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
